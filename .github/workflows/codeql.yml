name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
  - cron: '0 6 * * 1'  # weekly

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake zlib1g-dev \
          libqat-dev libtbb-dev nasm autoconf automake libtool pkg-config

    # ISA-L and QPL have no apt package new enough (ISA-L) or at all (QPL).
    # QATzip's apt package is too old for this code (missing QzLogLevel_T),
    # so it builds from source too, against libqat-dev above -- none of this
    # needs hardware or a driver, just headers and a library to link against.
    - name: Build ISA-L
      run: |
        git clone --depth 1 https://github.com/intel/isa-l.git "${{ runner.temp }}/isa-l"
        cd "${{ runner.temp }}/isa-l"
        ./autogen.sh
        ./configure --prefix="${{ runner.temp }}/deps"
        make -j
        make install

    - name: Build QPL
      run: |
        git clone --depth 1 https://github.com/intel/qpl.git "${{ runner.temp }}/qpl"
        cmake -S "${{ runner.temp }}/qpl" -B "${{ runner.temp }}/qpl/build" \
          -DCMAKE_BUILD_TYPE=Release -DQPL_BUILD_EXAMPLES=OFF -DQPL_BUILD_TESTS=OFF \
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/deps"
        cmake --build "${{ runner.temp }}/qpl/build" -j
        cmake --install "${{ runner.temp }}/qpl/build"

    - name: Build QATzip
      run: |
        git clone --depth 1 https://github.com/intel/QATzip.git "${{ runner.temp }}/QATzip"
        cd "${{ runner.temp }}/QATzip"
        ./autogen.sh
        ./configure
        make -j

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build zlib-accel
      if: matrix.build-mode == 'manual'
      run: |
        mkdir build && cd build
        cmake -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
          -DUSE_QAT=ON -DUSE_IAA=ON -DUSE_IGZIP=ON \
          -DDEBUG_LOG=ON -DENABLE_STATISTICS=ON \
          -DQPL_PATH="${{ runner.temp }}/deps" -DISAL_PATH="${{ runner.temp }}/deps" \
          -DQATZIP_PATH="${{ runner.temp }}/QATzip" \
          ..
        make

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"

    # Report only on a manual run, never on push/PR.
    - name: Generate Security Report
      if: github.event_name == 'workflow_dispatch'
      uses: rsdmike/github-security-report-action@v3.0.4
      with:
        template: report
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: GitHub Upload Release Artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: report
        path: |
         ./report.pdf
